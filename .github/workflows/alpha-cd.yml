name: ALPHA CD

on:
  push:
    paths:
      - 'src/**'
      - 'ios/**'
      - 'android/**'
    branches:
      - alpha

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Required for creating releases and pushing tags
      id-token: write      # Required for npm trusted publishing (provenance)
    steps:
      - uses: actions/checkout@v2
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
      - name: git config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build simple editor bundle
        run: npm run editor:build
      - name: Build web utils
        run: npm run editor:build-web-utils
      - name: Bump version for alpha release
        run: npm version prerelease --preid=alpha
      - name: Build package
        run: npm run prepare
      - name: Publish to npm with provenance
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
