name: Release

on:
  push:
    paths:
      - 'src/**'
      - 'ios/**'
      - 'android/**'
    branches:
      - main
      - alpha

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push tags, commits, create GitHub releases
      id-token: write        # npm OIDC trusted publishing (provenance)
      issues: write          # semantic-release GitHub plugin
      pull-requests: write   # semantic-release GitHub plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build editor bundle
        run: npm run editor:build

      - name: Build web utils
        run: npm run editor:build-web-utils

      - name: Build package
        run: npm run prepare

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          NPM_CONFIG_PROVENANCE: "true"
